name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CcfEditor.sln

      - name: Build
        run: dotnet build CcfEditor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/CcfEditor.Tests/CcfEditor.Tests.csproj --configuration Release --no-build --verbosity normal
