name: test-otmr-m1

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore CcfEditor.sln
      - name: Build
        run: dotnet build CcfEditor.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/CcfEditor.Tests/CcfEditor.Tests.csproj -c Release --no-build
